name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        # --ignore-scripts: the repo's npm preinstall runs `npx solidarity`, which
        # fails in this CI because Solidarity expects a dev environment (emulator,
        # git user.email, etc.). The actual build.sh script runs its own
        # `npm install --ignore-scripts` so we don't need the preinstall here.
        run: npm ci --ignore-scripts

      - name: Build Android APK
        run: npm run build:android

      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
          draft: true
          generate_release_notes: true
