---
name: github-release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v2.10.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  SNYK_VERSION: "1.1305.1"
  CYCLONEDX_VERSION: "v0.27.2"
  INTUNE_ENABLED: 'false'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/test
        uses: ./.github/actions/test

  # Build a signed, app-store-exported IPA for the GitHub release. Signing uses
  # the fork's own fastlane match repo (tindevelopers/certs) and App Store
  # Connect API key -- the same proven path as the build-ios-tin-beta pipeline.
  # Unlike that pipeline, we do NOT submit to TestFlight here; TestFlight
  # uploads happen on build-tin-N branch pushes (build-ios-tin-beta.yml). The
  # resulting IPA is attached to the tag release by the release job below.
  build-ios-signed:
    runs-on: macos-15-large
    needs:
      - test
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ci/setup-ssh-key
        uses: ./.github/actions/setup-ssh-key
        with:
          ssh-private-key: ${{ secrets.MM_MOBILE_PRIVATE_DEPLOY_KEY }}

      - name: ci/prepare-ios-build
        uses: ./.github/actions/prepare-ios-build
        with:
          intune-enabled: ${{ env.INTUNE_ENABLED }}

      - name: ci/seed-api-key
        shell: bash
        run: |
          printf '%s' "$IOS_API_KEY" > QH9A3BHKTP.p8
          chmod 600 QH9A3BHKTP.p8
        env:
          IOS_API_KEY: "${{ secrets.MM_MOBILE_IOS_API_KEY }}"
        working-directory: ./fastlane

      - name: ci/build-ios-release
        env:
          FASTLANE_TEAM_ID: "${{ secrets.MM_MOBILE_FASTLANE_TEAM_ID }}"
          IOS_API_ISSUER_ID: "${{ secrets.MM_MOBILE_IOS_API_ISSUER_ID }}"
          IOS_API_KEY: "${{ secrets.MM_MOBILE_IOS_API_KEY }}"
          IOS_API_KEY_ID: "${{ secrets.MM_MOBILE_IOS_API_KEY_ID }}"
          MATCH_GIT_URL: "${{ secrets.MM_MOBILE_MATCH_GIT_URL }}"
          MATCH_PASSWORD: "${{ secrets.MM_MOBILE_MATCH_PASSWORD }}"
          SENTRY_ENABLED: 'false'
        run: bundle exec fastlane ios build --env ios.tin-beta
        working-directory: ./fastlane

      - name: ci/upload-ios-release-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: TIN_Connect.ipa
          name: TIN_Connect.ipa


  build-android-unsigned:
    runs-on: ubuntu-22.04
    needs:
      - test
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ci/prepare-android-build
        uses: ./.github/actions/prepare-android-build
        with:
          sign: false

      - name: ci/build-android-beta
        env:
          TAG: "${{ env.RELEASE_TAG }}"
          GITHUB_TOKEN: "${{ secrets.MM_MOBILE_GITHUB_TOKEN }}"
        run: bundle exec fastlane android unsigned
        working-directory: ./fastlane

      - name: ci/upload-android-unsigned-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: Mattermost-unsigned.apk
          name: Mattermost-unsigned.apk

  generate-consolidated-sbom:
    runs-on: ubuntu-22.04
    needs:
      - build-ios-signed
      - build-android-unsigned
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ci/download-sboms
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sbom-*.json
          path: ${{ github.workspace }}
          merge-multiple: true
        continue-on-error: true

      - name: ci/setup-cyclonedx-cli
        run: |
          set -e
          CYCLONEDX_BINARY="cyclonedx-linux-x64"
          CYCLONEDX_URL="https://github.com/CycloneDX/cyclonedx-cli/releases/download/${{ env.CYCLONEDX_VERSION }}/${CYCLONEDX_BINARY}"

          # Download with better error handling and retry
          echo "Downloading CycloneDX CLI ${{ env.CYCLONEDX_VERSION }}..."
          curl -sSfL --retry 3 --retry-delay 5 "${CYCLONEDX_URL}" -o cyclonedx

          # Verify the binary is executable and not corrupted
          if [ ! -s cyclonedx ]; then
            echo "Error: Downloaded file is empty or corrupted"
            exit 1
          fi

          # Make executable and move to PATH
          chmod +x cyclonedx
          sudo mv cyclonedx /usr/local/bin/

          # Verify installation
          cyclonedx --version

      - name: ci/generate-consolidated-sbom
        continue-on-error: true
        env:
          SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}"
          SBOM_FILENAME: "sbom-${{ github.event.repository.name }}-${{ env.RELEASE_TAG }}.json"
        run: |
          # Check if required SBOM files are available
          if [ ! -f "sbom-android.json" ]; then
            echo "Error: sbom-android.json not found. Android SBOM generation may have failed."
            exit 0
          fi

          if [ ! -f "sbom-ios.json" ]; then
            echo "Error: sbom-ios.json not found. iOS SBOM generation may have failed."
            exit 0
          fi

          echo "All required SBOM files are available. Proceeding with consolidation..."

          # Generate top-level SBOM
          # snyk sbom --format=cyclonedx1.6+json --json-file-output=sbom-top-level.json

          # Consolidate SBOMs
          # cyclonedx merge \
          #   --input-files "sbom-top-level.json" "sbom-android.json" "sbom-ios.json" \
          #   --input-format=json \
          #   --output-file="$SBOM_FILENAME" \
          #   --output-format=json \
          #   --output-version=v1_6

          # Validate the consolidated SBOM
          # cyclonedx validate --input-file="$SBOM_FILENAME"
          touch "$SBOM_FILENAME"
        shell: bash

      - name: ci/upload-consolidated-sbom
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: sbom-${{ github.event.repository.name }}-${{ env.RELEASE_TAG }}.json
          name: sbom-${{ github.event.repository.name }}-${{ env.RELEASE_TAG }}.json

  release:
    runs-on: ubuntu-22.04
    needs:
      - build-ios-signed
      - build-android-unsigned
      - generate-consolidated-sbom
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ruby/setup-ruby@cb0fda56a307b8c78d38320cd40d9eb22a3bf04e # v1.242.0

      - name: release/setup-fastlane-dependencies
        run: bundle install
        working-directory: ./fastlane

      - name: ci/download-artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ github.workspace }}
          merge-multiple: true

      - name: release/create-github-release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # The release.yml workflow creates a draft release as part of its
          # build-android job via softprops/action-gh-release@v2, so by the time
          # we get here a draft may already exist. Be idempotent:
          #   - if assets are missing entirely, skip
          #   - if a release already exists for this tag, upload only the
          #     artifacts that aren't already attached (e.g. the iOS ipa is
          #     uploaded only from this job)
          #   - otherwise create the release with all available artifacts.
          set +e
          FILES=()
          [ -f TIN_Connect.ipa ] && FILES+=(TIN_Connect.ipa)
          [ -f Mattermost-unsigned.apk ] && FILES+=(Mattermost-unsigned.apk)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No artifacts available; skipping release creation."
            exit 0
          fi
          if gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1; then
            echo "Release ${{ env.RELEASE_TAG }} already exists; uploading any missing artifacts."
            for f in "${FILES[@]}"; do
              gh release upload "${{ env.RELEASE_TAG }}" "$f" --clobber
            done
          else
            gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --notes "Release ${{ env.RELEASE_TAG }}" "${FILES[@]}"
          fi
        working-directory: ./

      # The code repo is private; staff download the Android app from this public, installers-only repo.
      # The iOS build goes to TestFlight, so the .ipa is not published here.
      - name: release/publish-to-public-releases-repo
        if: ${{ hashFiles('Mattermost-unsigned.apk') != '' }}
        env:
          GH_TOKEN: "${{ secrets.RELEASES_TOKEN }}"
        run: |
          gh release create "mobile-${{ env.RELEASE_TAG }}" -R tin-wizard/tin-connect-releases --target main \
            --title "Mobile ${{ env.RELEASE_TAG }}" --notes "TIN Connect mobile ${{ env.RELEASE_TAG }}" Mattermost-unsigned.apk
        working-directory: ./
