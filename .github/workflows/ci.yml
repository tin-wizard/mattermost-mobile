name: ci
on:
  push:
    branches:
      - main
      - 'release*'
  pull_request:

permissions:
  pull-requests: write

env:
  NODE_VERSION: 24.15.0
  TERM: xterm

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only and workflow-only changes skip the checks (scripts/ci-changes.sh).
  # Anything unexpected runs everything: the gates below compare with != 'false'.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: ci/test-classifier
        run: bash scripts/ci-changes.test.sh
      - name: ci/classify
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null); then :; else files='*'; fi
          out=$(printf '%s\n' "$files" | bash scripts/ci-changes.sh) || out=''
          if [[ "$out" != "code=true" && "$out" != "code=false" ]]; then
            echo "::warning::ci-changes printed '$out'; running everything"
            exit 1
          fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          echo "Classifier: \`$out\`" >> "$GITHUB_STEP_SUMMARY"

  lint-typecheck:
    needs: changes
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps
      - name: ci/check-styles
        shell: bash
        run: |
          echo "::group::check-styles"
          npm run check
          echo "::endgroup::"
      - name: ci/check-i18n
        shell: bash
        run: |
          echo "::group::check-i18n"
          ./scripts/precommit/i18n.sh
          echo "::endgroup::"

  detox-lint-typecheck:
    # The detox/ package has its own tsconfig and is not covered by the root
    # check above. A TypeScript error in a detox test file makes its whole suite
    # fail to run, so the E2E shard exits non-zero and drops its JUnit, silently
    # reducing the reported test count. Type-check detox on every PR so the error
    # surfaces here instead.
    needs: changes
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps
      - name: ci/detox-install
        shell: bash
        # prepare-node-deps only installs the top-level node_modules; the detox
        # package has its own, needed for its type-check.
        run: cd detox && npm ci
      - name: ci/detox-typecheck
        shell: bash
        run: |
          echo "::group::detox-typecheck"
          cd detox && npm run tsc
          echo "::endgroup::"

  test:
    needs: changes
    timeout-minutes: 25
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps
      - name: ci/run-tests
        # main and PRs run test:coverage via the test-coverage action below;
        # release branches just need a plain test pass.
        if: startsWith(github.ref_name, 'release')
        shell: bash
        run: npm run test:ci
      - name: ci/test-coverage
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        uses: ./.github/actions/test-coverage
        with:
          run_id: ${{ github.run_id }}
