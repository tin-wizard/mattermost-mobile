---
name: build-ios-tin-beta

on:
  push:
    branches:
      - build-tin-[0-9]+

env:
  NODE_VERSION: 24.15.0
  TERM: xterm
  INTUNE_ENABLED: 'false'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@v4
      - name: ci/test
        uses: ./.github/actions/test

  build-ios-beta:
    runs-on: macos-15-large
    needs:
      - test
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@v4

      - name: ci/setup-ssh-key
        uses: ./.github/actions/setup-ssh-key
        with:
          ssh-private-key: ${{ secrets.MM_MOBILE_PRIVATE_DEPLOY_KEY }}

      - name: ci/prepare-ios-build
        uses: ./.github/actions/prepare-ios-build
        with:
          intune-enabled: 'false'

      - name: ci/seed-api-key
        shell: bash
        run: |
          printf '%s' "$IOS_API_KEY" > QH9A3BHKTP.p8
          chmod 600 QH9A3BHKTP.p8
        env:
          IOS_API_KEY: "${{ secrets.MM_MOBILE_IOS_API_KEY }}"
        working-directory: ./fastlane

      - name: ci/build-ios-beta
        env:
          FASTLANE_TEAM_ID: "${{ secrets.MM_MOBILE_FASTLANE_TEAM_ID }}"
          IOS_API_ISSUER_ID: "${{ secrets.MM_MOBILE_IOS_API_ISSUER_ID }}"
          IOS_API_KEY: "${{ secrets.MM_MOBILE_IOS_API_KEY }}"
          IOS_API_KEY_ID: "${{ secrets.MM_MOBILE_IOS_API_KEY_ID }}"
          MATCH_GIT_URL: "${{ secrets.MM_MOBILE_MATCH_GIT_URL }}"
          MATCH_PASSWORD: "${{ secrets.MM_MOBILE_MATCH_PASSWORD }}"
          SENTRY_ENABLED: 'false'
        run: bundle exec fastlane ios build --env ios.tin-beta
        working-directory: ./fastlane

      - name: ci/upload-ios-beta-build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-tin-${{ github.run_id }}
          path: "*.ipa"

      - name: ci/deploy-testflight
        env:
          FASTLANE_TEAM_ID: "${{ secrets.MM_MOBILE_FASTLANE_TEAM_ID }}"
          IOS_API_ISSUER_ID: "${{ secrets.MM_MOBILE_IOS_API_ISSUER_ID }}"
          IOS_API_KEY: "${{ secrets.MM_MOBILE_IOS_API_KEY }}"
          IOS_API_KEY_ID: "${{ secrets.MM_MOBILE_IOS_API_KEY_ID }}"
          PILOT_SKIP_WAITING_FOR_BUILD_PROCESSING: 'true'
        run: bundle exec fastlane ios deploy file:"${{ github.workspace }}/*.ipa" --env ios.tin-beta
        working-directory: ./fastlane
